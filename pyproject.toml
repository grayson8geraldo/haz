[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-futures-trader"
version = "1.0.0"
description = "Natural Gas Futures Trading System — NYMEX NG"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.25",
    "requests>=2.31",
    "yfinance>=0.2.31",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "plotly>=5.18",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Полный набор для live trading
full = [
    "aiohttp>=3.9",
    "websockets>=12.0",
    "ib_insync>=0.9.86",
    "optuna>=3.4",
    "python-telegram-bot>=20.7",
    "streamlit>=1.29",
    "schedule>=1.2",
    "pydantic>=2.5",
]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "black", "ruff"]

[tool.setuptools.packages.find]
include = ["gas_trader*"]

[tool.ruff]
line-length = 100
